name: nordvik-retaildw-starter

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set the local workshop value in .env}
    ports:
      - "127.0.0.1:${MSSQL_PORT:-14332}:1433"
    volumes:
      - retaildw-starter-data:/var/opt/mssql
      - ./mssql.conf:/var/opt/mssql/mssql.conf:ro
    restart: unless-stopped

volumes:
  retaildw-starter-data:
